# Test-builds every pull request, so broken content is caught before it reaches main.
name: Check pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Check content and build
        run: npm run build
